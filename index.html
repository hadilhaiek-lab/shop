/* Fournisseurs */
const lFour=()=>tbl(['Société','Contact','Téléphone','Email','Reste dû',''],DB.f.filter(f=>qm(f.n,f.c,f.t,f.e)).sort((a,b)=>a.n.localeCompare(b.n)).map(f=>[`<b>${esc(f.n)}</b>`,esc(f.c),esc(f.t),esc(f.e),M(dette(f.id)),`<button class="btn sm sec" onclick="fFiche('${f.id}')">Historique</button> <button class="btn sm sec" onclick="fForm('${f.id}')">Modifier</button> <button class="btn sm dg" onclick="fDel('${f.id}')">Supprimer</button>`]));
function fForm(id){const f=DB.f.find(x=>x.id==id)||{};modal(`<h2>${id?'Modifier le fournisseur':'Nouveau fournisseur'}</h2><div class="fg"><label>Nom de la société *<input id="fn1" value="${esc(f.n)}"></label><label>Nom du contact<input id="fc" value="${esc(f.c)}"></label><label>Téléphone<input id="ft" type="tel" value="${esc(f.t)}"></label><label>Email<input id="fe" type="email" value="${esc(f.e)}"></label><label class="w">Adresse<input id="fa" value="${esc(f.a)}"></label><label class="w">Notes<textarea id="fo" rows="3">${esc(f.o)}</textarea></label></div><div class="ac"><button class="btn sec" onclick="closeM()">Annuler</button><button class="btn" onclick="fSave('${id||''}')">Enregistrer</button></div>`)}
function fSave(id){const n=$('#fn1').value.trim();if(!n)return toast('Le nom de la société est obligatoire.');
if(DB.f.some(f=>f.id!=id&&f.n.toLowerCase()==n.toLowerCase()))return toast('Ce fournisseur existe déjà.');
const o={n,c:$('#fc').value.trim(),t:$('#ft').value.trim(),e:$('#fe').value.trim(),a:$('#fa').value.trim(),o:$('#fo').value.trim()};
if(id){Object.assign(DB.f.find(f=>f.id==id),o);log(`Fournisseur « ${n} » modifié`)}else{DB.f.push({id:uid(),...o});log(`Fournisseur « ${n} » ajouté`)}
save();closeM();render();toast('Fournisseur enregistré.')}
function fDel(id){if(DB.i.some(i=>i.f==id)||DB.a.some(a=>a.f==id))return toast('Suppression impossible : ce fournisseur a des achats enregistrés.');
ask(`Supprimer le fournisseur « ${esc(fn(id))} » ?`,()=>{log(`Fournisseur « ${fn(id)} » supprimé`);DB.f=DB.f.filter(f=>f.id!=id);save();render()})}
const payT=P=>tbl(['Date','Facture','Montant','Mode','Référence'],srt(P,'d').map(p=>[D(p.d),esc(invn(p.i)),M(p.m),esc(p.o),esc(p.r)]));
function fFiche(id){const f=DB.f.find(x=>x.id==id),I=DB.i.filter(i=>i.f==id),P=DB.p.filter(p=>p.f==id),k=[['Total des factures',T(I,i=>i.t)],['Total payé',T(P,p=>p.m)],['Reste à payer',dette(id)]];
modal(`<h2>${esc(f.n)}</h2><p class="mu">${[f.c,f.t,f.e,f.a].filter(Boolean).map(esc).join(' · ')||'Aucune coordonnée'}</p>${f.o?`<p>${esc(f.o)}</p>`:''}<div class="g">${k.map(x=>`<div class="card"><div class="k">${x[0]}</div><div class="v">${M(x[1])}</div></div>`).join('')}</div><h3>Historique des achats</h3>${tbl(['Date','Facture','Total','Restant','Statut'],srt(I,'d').map(i=>[D(i.d),esc(i.n),M(i.t),M(rest(i)),bd(i)]))}<h3>Historique des paiements</h3>${payT(P)}<div class="ac"><button class="btn" onclick="closeM()">Fermer</button></div>`)}
/* Achats */
const lAch=()=>tbl(['Date','Fournisseur','N° facture','Produits','Total','Mode',''],srt(DB.a,'d').filter(a=>qm(fn(a.f),a.n)&&inR(a.d)&&stOk(invOf(a.id))).map(a=>[D(a.d),esc(fn(a.f)),esc(a.n),esc(a.l[0].p)+(a.l.length>1?` (+${a.l.length-1})`:''),M(a.t),esc(a.m),`<button class="btn sm sec" onclick="aView('${a.id}')">Détails</button> <button class="btn sm dg" onclick="aDel('${a.id}')">Supprimer</button>`]));
const addL=()=>{const d=document.createElement('div');d.className='ln';d.innerHTML='<input class="lp" placeholder="Désignation"><input class="lq" type="number" min="0" step="any" value="1" oninput="calc()"><input class="lu" type="number" min="0" step="any" placeholder="Prix unit." oninput="calc()"><b class="lt">0,000</b><button type="button" class="btn sec sm" onclick="this.parentNode.remove();calc()">✕</button>';$('#lns').append(d)},
lines=()=>[...document.querySelectorAll('.ln')].map(l=>({p:l.querySelector('.lp').value.trim(),q:+l.querySelector('.lq').value||0,u:+l.querySelector('.lu').value||0}));
function calc(){let t=0;document.querySelectorAll('.ln').forEach(l=>{const s=r3((+l.querySelector('.lq').value||0)*(+l.querySelector('.lu').value||0));l.querySelector('.lt').textContent=s.toFixed(3).replace('.',',');t+=s});$('#at').textContent=M(t)}
function aForm(){if(!DB.f.length)return toast('Ajoutez d’abord un fournisseur.');
modal(`<h2>Nouvel achat</h2><div class="fg"><label>Fournisseur *<select id="as">${DB.f.map(f=>`<option value="${f.id}">${esc(f.n)}</option>`).join('')}</select></label><label>Date d’achat *<input id="ad" type="date" value="${today()}"></label><label>N° de facture ou bon de commande *<input id="an"></label><label>Date limite de paiement<input id="ae" type="date"></label></div><h3>Produits</h3><div id="lns"></div><button class="btn sec sm" onclick="addL()">+ Ajouter un produit</button><div class="tot">Total : <b id="at">0,000 DT</b></div><div class="fg"><label>Payé maintenant (DT)<input id="ap" type="number" min="0" step="any" value="0"></label><label>Mode de paiement<select id="am">${opt(['À crédit',...MODES])}</select></label><label class="w">Photo ou PDF de la facture (10 Mo max)<input id="af" type="file" accept="image/*,application/pdf"></label></div><div class="ac"><button class="btn sec" onclick="closeM()">Annuler</button><button class="btn" onclick="aSave()">Enregistrer l’achat</button></div>`);addL()}
async function aSave(){const f=$('#as').value,d=$('#ad').value,n=$('#an').value.trim(),e=$('#ae').value,Ls=lines().filter(l=>l.p&&l.q>0);
if(!d||!n)return toast('La date et le numéro de facture sont obligatoires.');
if(!Ls.length)return toast('Ajoutez au moins un produit avec une désignation et une quantité.');
if(DB.i.some(i=>i.f==f&&i.n.toLowerCase()==n.toLowerCase()))return toast('Doublon : cette facture existe déjà pour ce fournisseur.');
const t=r3(Ls.reduce((s,l)=>s+l.q*l.u,0)),pm=r3($('#ap').value);
if(t<=0)return toast('Le montant total doit être supérieur à 0.');if(pm>t)return toast('Le montant payé dépasse le total.');
let fl=null;const x=$('#af').files[0];if(x){if(x.size>1e7)return toast('Fichier trop lourd (10 Mo maximum).');const p=uid()+'-'+x.name.replace(/[^\w.\-]/g,'_'),u=await sb.storage.from('factures').upload(p,x);if(u.error)return toast('Envoi du fichier impossible.');fl={n:x.name,p}}
const aid=uid(),iid=uid(),mo=$('#am').value;
DB.a.push({id:aid,f,d,n,l:Ls,t,m:mo,fl});DB.i.push({id:iid,a:aid,f,n,d,e,t});
if(pm>0)DB.p.push({id:uid(),i:iid,f,d,m:pm,o:mo=='À crédit'?'Autre':mo,r:'',c:'Paiement à l’achat'});
log(`Achat ${n} enregistré (${fn(f)}, ${M(t)})`);save();closeM();render();toast('Achat et facture enregistrés.')}
const b64=d=>{const [h,s]=d.split(','),z=atob(s),u=new Uint8Array(z.length);for(let i=0;i<z.length;i++)u[i]=z.charCodeAt(i);return new Blob([u],{type:h.slice(5).split(';')[0]})};
function aView(id){const a=DB.a.find(x=>x.id==id),img=0;
modal(`<h2>Achat ${esc(a.n)}</h2><p class="mu">${esc(fn(a.f))} · ${D(a.d)} · ${esc(a.m)}</p>${tbl(['Désignation','Qté','Prix unitaire','Total'],a.l.map(l=>[esc(l.p),l.q,M(l.u),M(l.q*l.u)]))}<div class="tot">Total : <b>${M(a.t)}</b></div>${a.fl?`${img?`<img src="${esc(a.fl.url)}" style="max-width:100%;border-radius:8px" alt="Facture">`:''}<p><button class="btn sec" onclick="openF('${a.id}')">Ouvrir la facture (${esc(a.fl.n)})</button></p>`:''}<div class="ac"><button class="btn" onclick="closeM()">Fermer</button></div>`)}

function aDel(id){const a=DB.a.find(x=>x.id==id),i=invOf(id);if(DB.p.some(p=>p.i==i.id))return toast('Supprimez d’abord les paiements liés à cette facture.');
ask(`Supprimer l’achat ${esc(a.n)} et sa facture ?`,()=>{log(`Achat ${a.n} supprimé (${fn(a.f)})`);DB.a=DB.a.filter(x=>x.id!=id);DB.i=DB.i.filter(x=>x.id!=i.id);save();render()})}
/* Factures */
const lFac=()=>tbl(['N° facture','Fournisseur','Date','Échéance','Total','Payé','Restant','Statut',''],srt(DB.i,'d').filter(i=>qm(fn(i.f),i.n)&&inR(i.d)&&stOk(i)).map(i=>[`<b>${esc(i.n)}</b>`,esc(fn(i.f)),D(i.d),D(i.e),M(i.t),M(paid(i)),`<b>${M(rest(i))}</b>`,bd(i),(rest(i)>0?`<button class="btn sm" onclick="pForm('${i.id}')">Payer</button> `:'')+`<button class="btn sm sec" onclick="iView('${i.id}')">Détails</button>`]));
function iView(id){const i=DB.i.find(x=>x.id==id);modal(`<h2>Facture ${esc(i.n)}</h2><p class="mu">${esc(fn(i.f))} · du ${D(i.d)}${i.e?' · à payer avant le '+D(i.e):''}</p><div class="g"><div class="card"><div class="k">Total</div><div class="v">${M(i.t)}</div></div><div class="card"><div class="k">Déjà payé</div><div class="v">${M(paid(i))}</div></div><div class="card"><div class="k">Restant</div><div class="v">${M(rest(i))}</div></div></div><p>${bd(i)}</p><h3>Paiements de cette facture</h3>${payT(DB.p.filter(p=>p.i==id))}<div class="ac">${rest(i)>0?`<button class="btn" onclick="pForm('${id}')">Enregistrer un paiement</button>`:''}<button class="btn sec" onclick="closeM()">Fermer</button></div>`)}
/* Paiements */
const lPay=()=>tbl(['Date','Fournisseur','Facture','Montant','Mode','Référence','Commentaire',''],srt(DB.p,'d').filter(p=>qm(fn(p.f),invn(p.i),p.r)&&inR(p.d)).map(p=>[D(p.d),esc(fn(p.f)),esc(invn(p.i)),`<b>${M(p.m)}</b>`,esc(p.o),esc(p.r),esc(p.c),`<button class="btn sm dg" onclick="pDel('${p.id}')">Supprimer</button>`]));
function pForm(iid){const ou=DB.i.filter(i=>rest(i)>0||i.id==iid);if(!ou.length)return toast('Aucune facture à payer.');const s=iid||ou[0].id;
modal(`<h2>Nouveau paiement</h2><div class="fg"><label class="w">Facture concernée *<select id="pi" onchange="pFill()">${ou.map(i=>`<option value="${i.id}"${i.id==s?' selected':''}>${esc(fn(i.f))} — ${esc(i.n)} (reste ${M(rest(i))})</option>`).join('')}</select></label><label>Date du paiement *<input id="pd" type="date" value="${today()}"></label><label>Montant payé (DT) *<input id="pm" type="number" min="0" step="any"></label><label>Mode de paiement<select id="po">${opt(MODES)}</select></label><label>Référence<input id="pr"></label><label class="w">Commentaire<input id="pc"></label></div><p class="mu" id="ph"></p><div class="ac"><button class="btn sec" onclick="closeM()">Annuler</button><button class="btn" onclick="pSave()">Enregistrer le paiement</button></div>`);pFill()}
function pFill(){const i=DB.i.find(x=>x.id==$('#pi').value);$('#pm').value=rest(i);$('#ph').textContent=`Montant restant à payer sur cette facture : ${M(rest(i))}`}
function pSave(){const i=DB.i.find(x=>x.id==$('#pi').value),m=r3($('#pm').value),d=$('#pd').value;
if(!d)return toast('La date est obligatoire.');if(m<=0)return toast('Le montant doit être supérieur à 0.');
if(m>rest(i))return toast(`Le montant dépasse le reste à payer (${M(rest(i))}).`);
DB.p.push({id:uid(),i:i.id,f:i.f,d,m,o:$('#po').value,r:$('#pr').value.trim(),c:$('#pc').value.trim()});
log(`Paiement de ${M(m)} sur la facture ${i.n} (${fn(i.f)})`);save();closeM();render();toast(rest(i)>0?`Paiement enregistré. Reste à payer : ${M(rest(i))}`:'Paiement enregistré. Facture entièrement payée.')}
function pDel(id){const p=DB.p.find(x=>x.id==id);ask(`Supprimer le paiement de ${M(p.m)} du ${D(p.d)} ? Le reste à payer sera recalculé.`,()=>{log(`Paiement de ${M(p.m)} supprimé (facture ${invn(p.i)})`);DB.p=DB.p.filter(x=>x.id!=id);save();render()})}
/* Rapports */
const RP=()=>{const mo={};DB.a.forEach(a=>{const k=a.d.slice(0,7);mo[k]=r3((mo[k]||0)+a.t)});
return[{t:'Total des achats par mois',h:['Mois','Total des achats'],r:Object.keys(mo).sort().reverse().map(k=>[k.slice(5)+'/'+k.slice(0,4),mo[k]]),m:[1]},
{t:'Total payé par fournisseur',h:['Fournisseur','Total payé'],r:DB.f.map(f=>[f.n,T(DB.p.filter(p=>p.f==f.id),p=>p.m)]),m:[1]},
{t:'Dettes restantes par fournisseur',h:['Fournisseur','Reste à payer'],r:DB.f.map(f=>[f.n,dette(f.id)]).filter(x=>x[1]>0),m:[1]},
{t:'Factures en retard',h:['N° facture','Fournisseur','Échéance','Reste à payer'],r:DB.i.filter(late).map(i=>[i.n,fn(i.f),D(i.e),rest(i)]),m:[3]}]};
const rep=()=>hd('Rapports')+RP().map((x,k)=>`<div class="card rc" id="rc${k}"><div class="hd"><h2>${x.t}</h2><span class="noprint"><button class="btn sm sec" onclick="xr(${k})">Exporter Excel</button> <button class="btn sm" onclick="pr(${k})">PDF / Imprimer</button></span></div>${tbl(x.h,x.r.map(r=>r.map((c,j)=>x.m.includes(j)?M(c):esc(c)))).replace('card tw','tw')}</div>`).join('');
const csv=(h,r)=>'\ufeff'+[h,...r].map(x=>x.map(c=>`"${String(typeof c=='number'?String(c).replace('.',','):c??'').replace(/"/g,'""')}"`).join(';')).join('\r\n'),
xr=k=>{const x=RP()[k];sv(`mosaik7-${x.t.toLowerCase().replace(/[^a-z]+/g,'-')}.csv`,csv(x.h,x.r))};
function pr(k){const e=$('#rc'+k);e.classList.add('only');document.body.classList.add('pr');try{print()}catch(x){toast('Utilisez Ctrl+P pour enregistrer en PDF.')}setTimeout(()=>{e.classList.remove('only');document.body.classList.remove('pr')},600)}
function sv(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'}));a.download=name;document.body.append(a);a.click();a.remove()}
/* Données, sauvegarde, journal */
const EX={fournisseurs:()=>[['Société','Contact','Téléphone','Email','Adresse','Notes'],DB.f.map(f=>[f.n,f.c,f.t,f.e,f.a,f.o])],
achats:()=>[['Date','Fournisseur','N° facture','Désignation','Quantité','Prix unitaire','Total ligne','Mode'],DB.a.flatMap(a=>a.l.map(l=>[D(a.d),fn(a.f),a.n,l.p,l.q,l.u,r3(l.q*l.u),a.m]))],
factures:()=>[['N° facture','Fournisseur','Date','Échéance','Total','Payé','Restant','Statut'],DB.i.map(i=>[i.n,fn(i.f),D(i.d),D(i.e),i.t,paid(i),rest(i),stat(i)])],
paiements:()=>[['Date','Fournisseur','Facture','Montant','Mode','Référence','Commentaire'],DB.p.map(p=>[D(p.d),fn(p.f),invn(p.i),p.m,p.o,p.r,p.c])]};
const dat=()=>hd('Données et journal')+`<div class="card"><h2>Sauvegarde</h2><p class="mu">Vos données sont enregistrées dans la base de données en ligne de ce site : elles sont partagées entre tous vos appareils. Une sauvegarde de temps en temps reste conseillée.</p><button class="btn" onclick="sv('mosaik7-sauvegarde-'+today()+'.json',JSON.stringify(DB))">Télécharger une sauvegarde</button><p><label>Restaurer une sauvegarde<input type="file" accept=".json,application/json" onchange="rst(this)"></label></p><p><label>Ou collez ici le texte d’une sauvegarde<textarea id="rt" rows="3"></textarea></label></p><button class="btn sec" onclick="rst({files:[new Blob([$('#rt').value])]})">Restaurer depuis le texte</button></div><div class="card"><h2>Exports Excel</h2>${Object.keys(EX).map(k=>`<button class="btn sec" onclick="sv('mosaik7-${k}.csv',csv(...EX.${k}()))">${k[0].toUpperCase()+k.slice(1)}</button>`).join(' ')}</div><h2>Journal des opérations</h2>${tbl(['Date et heure','Opération'],DB.j.map(j=>[new Date(j.d).toLocaleString('fr-FR'),esc(j.t)]))}`;
function rst(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=remap(JSON.parse(r.result));if(!['f','a','i','p'].every(k=>Array.isArray(d[k])))throw 0;
ask(`Remplacer toutes les données actuelles par cette sauvegarde (${d.f.length} fournisseurs, ${d.i.length} factures) ?`,()=>{DB=Object.assign({j:[]},d);DB.a.forEach(a=>{if(a.fl&&a.fl.d)a.fl=null});log('Sauvegarde restaurée');save();render();toast('Données restaurées.')})}catch(e){toast('Fichier de sauvegarde invalide.')}};r.readAsText(f)}
(()=>{const h=location.hash.slice(1);V=NAV.some(n=>n[0]==h)?h:'dash';render();start()})();
</script></body></html>
